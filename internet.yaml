scale: 10
interval: 1s
devices:
  # --- 三大公雲 (Top 3 Public Clouds) ---
  - name: "---"
  # 使用 Anycast 邊緣 IP，能反映最近的雲端進入點延遲
  - name: "Google-Global-DNS"
    ip: "8.8.8.8"           # Google Public DNS (Anycast)
  - name: "AWS-Global-Accelerator"
    ip: "15.197.142.173"    # AWS 全球加速器節點 (非常穩定)
  - name: "AWS-Static-Anycast"
    ip: "99.83.190.1"       # AWS 另一個主要的 Anycast 進入點
  - name: "Azure-Front-Door"
    ip: "13.107.21.200"     # Microsoft/Azure 全球內容傳遞網節點

  # --- 世界前 5 大 ISP 業者 (Top 5 Global Tier-1 ISPs) ---
  # 這些是網路骨幹業者，選用其 Looking Glass 或核心 DNS
  - name: "---"
  - name: "Lumen-Level3"
    ip: "4.2.2.1"           # 全球最知名的 Tier-1 測試點
  - name: "NTT-Communications"

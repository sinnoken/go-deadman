  - name: "HKIX-Hong-Kong-RS"
    ip: "123.255.90.11"     # 香港交換中心 HKIX 路由伺服器

  # --- 世界前 3 大 CDN 業者 (Top 3 Global CDNs) ---
  - name: "---"
  - name: "Cloudflare-Anycast"
    ip: "1.1.1.1"           # 全球最快的 Anycast DNS 之一

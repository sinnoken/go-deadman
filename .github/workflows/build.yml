name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '.gitignore', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '.gitignore', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags tasks ./...

      - name: go test (race)
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags tasks ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          # v2.29.0 讀不了 Go 1.27 的 export data（version 5）；正式版支援後改回 @latest
          go install github.com/securego/gosec/v2/cmd/gosec@master
          gosec ./...

  build:
    name: Build ${{ matrix.preset }} ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # build provenance attestation
      attestations: write
    strategy:
      matrix:
        preset: [internet, tasks]
        goos: [windows]
        goarch: [amd64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dev+${GITHUB_SHA::7}"
          fi
          numeric="${version#v}"; numeric="${numeric%%[-+]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      - name: Windows resources (go-winres)
        if: matrix.goos == 'windows'
        run: |
          GOOS= GOARCH= go install github.com/tc-hib/go-winres@latest
          go-winres make --in winres/winres.json --out cmd/go-deadman/rsrc \
            --arch "${{ matrix.goarch }}" \
            --product-version "${{ steps.ver.outputs.numeric }}" \
            --file-version "${{ steps.ver.outputs.numeric }}"

      - name: Build
        id: build
        run: |
          exe=go-deadman
          if [ "${{ matrix.goos }}" = "windows" ]; then exe="$exe.exe"; fi
          pkg="go-deadman-${{ matrix.preset }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "stage/$pkg" dist
          go build -tags "${{ matrix.preset }}" -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "stage/$pkg/$exe" ./cmd/go-deadman
          cp LICENSE README.md "stage/$pkg/"
          (cd stage && zip -qr "../dist/$pkg.zip" "$pkg")
          echo "exe=stage/$pkg/$exe" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.build.outputs.exe }}
            dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: go-deadman-${{ matrix.preset }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: go-deadman-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag

name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # <--- 加入這一行，開啟手動觸發開關
    
permissions:
  contents: write # 必備：允許 Actions 建立 Release

jobs:
  lint:
    name: Lint and Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
  
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Initialize & Install Dependencies
        run: |
          if [ ! -f go.mod ]; then
            go mod init go-deadman
          fi
          go mod tidy
          go mod download

      - name: Install and Run go-winres (Windows only)
        if: matrix.goos == 'windows'
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make
          
      - name: Prepare Configuration
        run: |
          cp internet.yaml config.yaml
          
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      
      - name: Run Gosec
        uses: securego/gosec@master
        env:
          GOTOOLCHAIN: auto
        with:
          args: ./... # 掃描全專案
                
  build:
    name: Build Binary
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 第一維度：版本
        config: [tasks,internet ] 
        # 第二維度：作業系統
        # goos: [linux, windows, darwin]
        goos: [windows]
        # 第三維度：架構 goarch: [amd64, arm64]
        goarch: [amd64]
        # 排除不想要的組合 (例如 windows 不需要 arm64)
        exclude:
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v6
  
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Initialize & Install Dependencies
        run: |
          if [ ! -f go.mod ]; then
            go mod init go-deadman
          fi
          go mod tidy
          go mod download

      - name: Install and Run go-winres (Windows only)
        if: matrix.goos == 'windows'
        run: |
          VERSION=${{ github.ref_name }}
          go install github.com/tc-hib/go-winres@latest
          go-winres make --product-version git-tag --file-version git-tag
          
      - name: Prepare Configuration
        run: |
          cp ${{ matrix.config }}.yaml config.yaml
                   
      - name: Build Binary
        run: |
          # 加上 matrix.config 區分檔名
          BINARY_NAME=deadman-${{ matrix.config }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w" -trimpath -o "$BINARY_NAME" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          # 這裡必須唯一，加入 matrix.config
          name: deadman-${{ matrix.config }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: deadman-${{ matrix.config }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  # --- 新增的 Release Job ---
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # 只有在推送 Tag 時才執行發布
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: deadman-*
          merge-multiple: true # 將所有子目錄的檔案合併到同一個資料夾

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/* # 發布所有編譯出的檔案
          generate_release_notes: true # 自動生成變更日誌
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

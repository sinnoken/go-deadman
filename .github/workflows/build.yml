name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # <--- 加入這一行，開啟手動觸發開關
    
permissions:
  contents: write # 必備：允許 Actions 建立 Release

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
  
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
  
      - name: Initialize & Install Dependencies
        run: |
          if [ ! -f go.mod ]; then
            go mod init go-deadman
          fi
          go mod tidy

      - name: Build Binary
        run: |
          BINARY_NAME=deadman-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          
          # 編譯瘦身
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w" -o "$BINARY_NAME" .

          # Windows 壓縮
          if [ "${{ matrix.goos }}" = "windows" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            sudo apt-get update && sudo apt-get install -y upx
            upx --best "$BINARY_NAME"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: deadman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: deadman-${{ matrix.goos }}-${{ matrix.goarch }}*

  # --- 新增的 Release Job ---
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # 只有在推送 Tag 時才執行發布
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts
          pattern: deadman-*
          merge-multiple: true # 將所有子目錄的檔案合併到同一個資料夾

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/* # 發布所有編譯出的檔案
          generate_release_notes: true # 自動生成變更日誌
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

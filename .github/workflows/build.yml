name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '.gitignore', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '.gitignore', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags tasks ./...

      - name: go test (race)
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags tasks ./...

      - name: Coverage (internal/monitor >= 80%)
        run: |
          pct=$(go test -count=1 -cover ./internal/monitor | grep -oE '[0-9.]+% of statements' | cut -d% -f1)
          echo "internal/monitor coverage: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v p="$pct" 'BEGIN { exit !(p >= 80) }'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: gosec
        run: |
          # v2.29.0 讀不了 Go 1.27 的 export data（version 5），暫時鎖定 master 上的 commit；
          # 正式版支援 Go 1.27 後改成鎖定版本號
          go install github.com/securego/gosec/v2/cmd/gosec@1cbfd7e6488c2464f18603623354de1be9565b39
          gosec ./...

  test-os:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.preset }} ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [test, test-os]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # build provenance attestation
      attestations: write
    strategy:
      matrix:
        preset: [internet, tasks]
        goos: [windows, darwin]
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64   # Apple Silicon（含 MacBook Neo）；Go linker 會自動 ad-hoc 簽章
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dev+${GITHUB_SHA::7}"
          fi
          numeric="${version#v}"; numeric="${numeric%%[-+]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      - name: Windows resources (go-winres)
        if: matrix.goos == 'windows'
        run: |
          GOOS= GOARCH= go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in winres/winres.json --out cmd/go-deadman/rsrc \
            --arch "${{ matrix.goarch }}" \
            --product-version "${{ steps.ver.outputs.numeric }}" \
            --file-version "${{ steps.ver.outputs.numeric }}"

      - name: Build
        id: build
        run: |
          exe=go-deadman
          if [ "${{ matrix.goos }}" = "windows" ]; then exe="$exe.exe"; fi
          pkg="go-deadman-${{ matrix.preset }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "stage/$pkg" dist
          go build -tags "${{ matrix.preset }}" -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "stage/$pkg/$exe" ./cmd/go-deadman
          cp LICENSE README.md "stage/$pkg/"
          (cd stage && zip -qr "../dist/$pkg.zip" "$pkg")
          echo "exe=stage/$pkg/$exe" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            ${{ steps.build.outputs.exe }}
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-deadman-${{ matrix.preset }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: go-deadman-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag
